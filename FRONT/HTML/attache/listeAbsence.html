<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#7C3AED",
                        secondary: "#F59E0B",
                        accent: "#EC4899",
                    },
                },
            },
        };
    </script>
    <style>
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }
    </style>
</head>

<body class="bg-gray-100">
    <div class="flex h-screen -mt-20">
        <div id="sidebaratt" class=""></div>

        <div class="flex-1">
            <div id="navbar"></div>

            <!-- Main Content -->
            <main class="flex-1 space-y-8 p-6 w-full">
                <div class="flex-1 p-6 md:p-8 rounded-2xl bg-white shadow-xl overflow-y-auto h-[70vh] bg-purple-300">
                    <!-- En-tête -->
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                        <div>
                            <h2
                                class="text-3xl font-bold bg-gradient-to-r from-primary to-accent bg-clip-text text-transparent">
                                Liste des Absences
                            </h2>
                            <p class="text-gray-500 mt-1">Tous les absences</p>
                        </div>

                        <div class="flex space-x-3">
                            <!-- Filtre par date -->
                            <form id="date-filter-form"
                                class="flex flex-col md:flex-row items-center justify-between bg-white  rounded-xl  gap-4">
                                <div class="flex items-center gap-2">
                                    <input type="date" name="date" id="date"
                                        class="border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring focus:ring-purple-200" />
                                </div>
                                <div class="flex gap-2">
                                    <button type="submit"
                                        class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition">filtrer</button>
                                    <button id="reset-filter-btn"
                                        class="bg-gray-200 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-300 transition">Réinitialiser</button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Liste des cartes -->
                    <div id="cours-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        <!-- Les cartes cours seront injectées ici en JS -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- JS composants -->
    <script src="../composant/sidebar/sidebaratt.js"></script>
    <script src="../composant/navbar/navbar.js"></script>
    <script src="../../JS/auth/deconnexion.js"></script>
    <script src="../../JS/attache/listeAbsence.js"></script>
</body>

</html>
