<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#7C3AED",
                        secondary: "#F59E0B",
                        accent: "#EC4899",
                    },
                },
            },
        };
    </script>
    <style>
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }
    </style>
</head>

<body class="bg-gray-100">
    <div class="flex h-screen -mt-20">
        <div id="sidebarEtudiant" class=""></div>

        <div class="flex-1">
            <div id="navbar"></div>

            <!-- Main Content -->
            <main class="flex-1 space-y-8 p-6 w-full">
                <!-- Contenu Principal -->
                <div class="flex-1 p-6 md:p-8 rounded-2xl bg-white shadow-xl">
                    <!-- En-tête avec titre et boutons -->
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                        <div>
                            <h2 class="text-3xl font-bold bg-gradient-to-r from-primary to-accent bg-clip-text text-transparent">Liste des Absences</h2>
                            <p class="text-gray-500 mt-1">Gestion des absences étudiantes</p>
                        </div>
                        
                        <div class="flex space-x-3">
                            <button class="flex items-center px-4 py-2.5 border border-gray-200 rounded-xl shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 transition-all duration-300 hover:-translate-y-0.5 hover:shadow-md">
                                <i class="fas fa-sliders-h mr-2 text-primary"></i> Filtres
                            </button>
                        </div>
                    </div>

                    <!-- Message d'alerte -->
                    <div id="alertMessage" class="mb-6 p-4 rounded-lg hidden"></div>

                    <!-- Conteneur des absences -->
                    <div id="absencesContainer" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                        <!-- Les absences seront chargées ici dynamiquement -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- JS composants -->
    <script src="../composant/sidebar/sidebarEtudiant.js"></script>
    <script src="../composant/navbar/navbar.js"></script>
    <script src="../../JS/auth/deconnexion.js"></script>
    <script src="../../JS/etudiant/listeAbsence.js"></script>
    
   
</body>
</html>
